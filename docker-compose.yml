services:
  bot:
    build: .
    env_file: .env
    volumes: ["munim-data:/data"]
    restart: unless-stopped
  api:
    build: .
    command: uvicorn munim.api.server:app --host 0.0.0.0 --port 8080
    env_file: .env
    volumes: ["munim-data:/data"]
    ports: ["8080:8080"]
    restart: unless-stopped
volumes:
  munim-data:
