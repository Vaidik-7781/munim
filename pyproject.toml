[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "munim"
version = "0.1.0"
description = "Voice-native Telegram udhaar ledger for kirana shops, built on Gnani Prisma/Timbre."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "numpy>=1.26",
  "rapidfuzz>=3.6",
  "unidecode>=1.3",
  "pyyaml>=6.0",
  "python-telegram-bot[job-queue]>=21",
  "reportlab>=4.0",
  "qrcode>=7.4",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
live = ["websockets>=12"]
bench = ["jiwer>=3.0", "faster-whisper>=1.0", "gTTS>=2.5", "matplotlib>=3.8"]

[project.scripts]
munim = "munim.app:main"
munim-verify = "munim.ledger.chain:cli_verify"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"munim.api" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
  "ignore:.*httpx.*starlette.testclient.*:Warning",
]
testpaths = ["tests"]
pythonpath = ["src"]
