<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Munim Dashboard</title><link rel="manifest" href="/app/manifest.webmanifest">
<style>
:root{--bg:#faf7f2;--fg:#1d1d1b;--card:#fff;--mut:#6b6b66;--ok:#1f6f50;--bad:#b3261e;--line:#e6e0d6;--bar:#1f6f50}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151513;--fg:#f1eee8;--card:#201f1d;--mut:#a29f96;--ok:#5fc59a;--bad:#f2867e;--line:#35332f;--bar:#5fc59a}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}h1{font-size:1.3rem;margin:.2rem 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
.big{font-size:1.8rem;font-weight:700}.mut{color:var(--mut);font-size:.85rem}.ok{color:var(--ok)}.bad{color:var(--bad)}
.row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}button{background:var(--ok);color:#fff;border:0}
svg{width:100%;height:90px}
</style></head><body><main>
<h1 id="shop">Munim</h1>
<div class="card" id="login"><div class="mut">Owner API key (kept only in this browser)</div>
<p><input id="key" type="password" placeholder="mk_…" autocomplete="off"> <button id="go">Open</button></p><div id="err" class="bad"></div></div>
<div id="dash" hidden>
<div class="card"><div class="mut">Total outstanding</div><div class="big" id="out"></div><div id="chain" class="mut"></div></div>
<div class="card"><div class="mut">Aging (₹)</div><svg id="aging" viewBox="0 0 300 90" role="img" aria-label="aging buckets"></svg></div>
<div class="card"><div class="mut">Top debtors</div><div id="debtors"></div></div>
<div class="card"><div class="mut">Cash-Flow Passport</div><div class="big" id="tier">–</div><div id="why" class="mut"></div></div>
<div class="card"><div class="mut">Staff flags</div><div id="flags"></div></div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id), rs=p=>"₹"+(p/100).toLocaleString("en-IN",{maximumFractionDigits:0});
const store={get(){try{return localStorage.getItem("munim_key")||""}catch(e){return ""}},set(v){try{localStorage.setItem("munim_key",v)}catch(e){}}};
function line(parent,a,b){const r=document.createElement("div");r.className="row";const x=document.createElement("span"),y=document.createElement("span");x.textContent=a;y.textContent=b;r.append(x,y);parent.append(r)}
async function api(path,key){const r=await fetch(path,{headers:{"X-API-Key":key}});if(!r.ok)throw new Error(r.status===401?"Invalid key":"Error "+r.status);return r.json()}
async function load(key){
  const s=await api("/v1/dashboard/summary",key);
  $("shop").textContent=s.shop;$("out").textContent=rs(s.outstanding_paise);
  $("chain").textContent=s.chain_ok?"✓ ledger chain verified":"✗ chain check failed";$("chain").className="mut "+(s.chain_ok?"ok":"bad");
  const d=$("debtors");d.textContent="";s.top_debtors.forEach(x=>line(d,x.name,rs(x.paise)));
  const svg=$("aging");svg.textContent="";const ks=Object.keys(s.aging),mx=Math.max(1,...Object.values(s.aging));
  ks.forEach((k,i)=>{const h=Math.round(60*s.aging[k]/mx),ns="http://www.w3.org/2000/svg";
    const r=document.createElementNS(ns,"rect");r.setAttribute("x",10+i*58);r.setAttribute("y",70-h);r.setAttribute("width",44);r.setAttribute("height",h);r.setAttribute("fill","var(--bar)");svg.append(r);
    const t=document.createElementNS(ns,"text");t.setAttribute("x",32+i*58);t.setAttribute("y",86);t.setAttribute("text-anchor","middle");t.setAttribute("font-size","10");t.setAttribute("fill","currentColor");t.textContent=k;svg.append(t)});
  const f=$("flags");f.textContent="";(s.staff_flags.length?s.staff_flags:["none"]).forEach(x=>line(f,x,""));
  try{const p=await api("/v1/dashboard/passport",key);$("tier").textContent=p.tier==="NA"?"Not enough history":"Tier "+p.tier+" · "+p.score+"/100";$("why").textContent=(p.reasons||[]).join("  |  ")}catch(e){$("tier").textContent="–"}
  $("login").hidden=true;$("dash").hidden=false;
}
$("go").onclick=async()=>{const k=$("key").value.trim();try{await load(k);store.set(k)}catch(e){$("err").textContent=e.message}};
const k0=store.get();if(k0)load(k0).catch(()=>{});
if("serviceWorker" in navigator)navigator.serviceWorker.register("/app/sw.js").catch(()=>{});
</script></main></body></html>
